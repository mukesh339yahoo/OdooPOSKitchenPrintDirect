services:
  web:
    image: odoo:20.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ../:/mnt/extra-addons
      - odoo20-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    command: -- --http-interface=0.0.0.0 -d odoo20_test --dev=all
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo20-db-data:/var/lib/postgresql/data
volumes:
  odoo20-db-data:
  odoo20-web-data:
