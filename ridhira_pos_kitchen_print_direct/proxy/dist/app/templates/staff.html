<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS Staff Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #22c55e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
        }

        .order-btn {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .order-btn:active {
            transform: scale(0.95);
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--accent-green);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
            background: var(--surface-color);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kitchen - Tap when Ready</h1>
            <a href="/" style="color: var(--text-secondary); text-decoration: none; padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; background: rgba(255,255,255,0.05);">Dashboard</a>
        </header>
        
        <div class="grid" id="orders-grid">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

    <script>
        let currentOrders = [];

        async function fetchState() {
            try {
                const res = await fetch('/api/kds/state');
                const orders = await res.json();
                
                // Only keep Preparing orders for staff screen
                const preparingOrders = orders.filter(o => o.status === 'Preparing');
                
                // Check if anything changed to avoid DOM thrashing
                if (JSON.stringify(preparingOrders) !== JSON.stringify(currentOrders)) {
                    currentOrders = preparingOrders;
                    renderOrders(preparingOrders);
                }
            } catch (error) {
                console.error("Failed to fetch state:", error);
            }
        }

        function renderOrders(orders) {
            const grid = document.getElementById('orders-grid');
            grid.innerHTML = '';
            
            if (orders.length === 0) {
                grid.innerHTML = '<div class="empty-state">No orders in preparation.</div>';
                return;
            }
            
            // Sort by oldest first so staff does oldest orders
            orders.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            orders.forEach(order => {
                const btn = document.createElement('button');
                btn.className = 'order-btn';
                btn.textContent = order.queue_number;
                btn.onclick = () => markReady(order.queue_number);
                grid.appendChild(btn);
            });
        }

        async function markReady(queueNumber) {
            try {
                await fetch('/api/kds/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ queue_number: queueNumber, status: 'Ready' })
                });
                fetchState(); // Instantly refresh
            } catch (error) {
                console.error("Error updating order:", error);
                alert("Failed to update order");
            }
        }

        // Fetch immediately and then poll every 2 seconds
        fetchState();
        setInterval(fetchState, 2000);
    </script>
</body>
</html>
