<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Proxy Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --status-pending: #eab308;
            --status-printing: #3b82f6;
            --status-completed: #22c55e;
            --status-failed: #ef4444;
            --status-cancelled: #64748b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-panel {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Printer Status Grid */
        .printers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .printer-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .printer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .printer-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-type { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        
        .printer-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .queue-count {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        button.primary {
            background: var(--accent-blue);
            border-color: transparent;
        }

        button.primary:hover {
            background: #2563eb;
        }

        /* Jobs Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-pending .status-dot { background: var(--status-pending); box-shadow: 0 0 8px var(--status-pending); }
        .status-printing .status-dot { background: var(--status-printing); box-shadow: 0 0 8px var(--status-printing); }
        .status-completed .status-dot { background: var(--status-completed); }
        .status-failed .status-dot { background: var(--status-failed); box-shadow: 0 0 8px var(--status-failed); }
        .status-cancelled .status-dot { background: var(--status-cancelled); }

        .job-id {
            color: var(--text-secondary);
            font-family: monospace;
            font-size: 0.8rem;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .action-btns button {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }

        .error-msg {
            color: var(--status-failed);
            font-size: 0.75rem;
            margin-top: 0.25rem;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Print Proxy Dashboard</h1>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="{{ url_for('settings') }}" style="color: var(--text-primary); text-decoration: none; padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; background: rgba(255,255,255,0.1); transition: all 0.2s; font-size: 0.875rem; font-weight: 500;">Settings</a>
                <div id="connection-status" style="color: var(--status-completed); font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem;">
                    <div class="status-dot" style="background: var(--status-completed); box-shadow: 0 0 8px var(--status-completed);"></div>
                    Live Updates
                </div>
            </div>
        </header>

        <section class="printers-grid" id="printers-container">
            <!-- Printer cards injected via JS -->
            <div class="glass-panel" style="display: flex; justify-content: center; padding: 2rem;">
                Loading printers...
            </div>
        </section>

        <!-- Live Weighing Scale Panel -->
        <section class="glass-panel" style="margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span style="font-size: 1.5rem;">⚖️</span>
                    <div>
                        <h2 style="margin: 0; font-size: 1.25rem; font-weight: 600;">Live Counter Weighing Scale</h2>
                        <span id="scale-port-desc" style="font-size: 0.8rem; color: var(--text-secondary);">Scanning COM ports...</span>
                    </div>
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <span id="scale-status-badge" class="badge" style="background: rgba(100, 116, 139, 0.2); color: #94a3b8;">Checking</span>
                    <span id="scale-motion-badge" class="badge" style="background: rgba(100, 116, 139, 0.2); color: #94a3b8;">--</span>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; align-items: center;">
                <!-- Digital LCD Readout -->
                <div style="background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1.25rem; text-align: center;">
                    <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 0.25rem;">Live Net Weight</div>
                    <div id="scale-weight-val" style="font-size: 3rem; font-weight: 700; font-family: monospace; color: #38bdf8; letter-spacing: 0.05em; line-height: 1.1;">
                        0.000 <span style="font-size: 1.5rem; color: #94a3b8;">kg</span>
                    </div>
                    <div style="display: flex; justify-content: space-around; margin-top: 0.75rem; font-size: 0.8rem; color: var(--text-secondary); border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 0.5rem;">
                        <span>Gross: <strong id="scale-gross-val" style="color: var(--text-primary);">0.000 kg</strong></span>
                        <span>Tare: <strong id="scale-tare-val" style="color: var(--text-primary);">0.000 kg</strong></span>
                    </div>
                </div>

                <!-- Controls & Port Config -->
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <div style="display: flex; gap: 0.5rem;">
                        <button onclick="triggerScaleTare()" style="flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(59, 130, 246, 0.2); color: #93c5fd; font-weight: 600; cursor: pointer;">
                            Tare
                        </button>
                        <button onclick="triggerScaleZero()" style="flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255, 255, 255, 0.08); color: var(--text-primary); font-weight: 600; cursor: pointer;">
                            Zero
                        </button>
                        <button onclick="toggleScaleSettings()" style="padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255, 255, 255, 0.08); color: var(--text-primary); cursor: pointer;" title="Configure Scale Port">
                            ⚙️
                        </button>
                    </div>

                    <!-- Expandable Config Drawer -->
                    <div id="scale-config-panel" style="display: none; background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);">
                        <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #93c5fd;">Scale Hardware Settings</div>
                        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 120px;">
                                <label style="font-size: 0.75rem; color: var(--text-secondary); display: block;">COM Port</label>
                                <select id="scale-port-select" style="width: 100%; padding: 0.4rem; background: #1e293b; color: white; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.8rem;"></select>
                            </div>
                            <div style="flex: 1; min-width: 90px;">
                                <label style="font-size: 0.75rem; color: var(--text-secondary); display: block;">Baud Rate</label>
                                <select id="scale-baud-select" style="width: 100%; padding: 0.4rem; background: #1e293b; color: white; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.8rem;">
                                    <option value="9600">9600</option>
                                    <option value="4800">4800</option>
                                    <option value="19200">19200</option>
                                    <option value="2400">2400</option>
                                </select>
                            </div>
                            <div style="flex: 1; min-width: 110px;">
                                <label style="font-size: 0.75rem; color: var(--text-secondary); display: block;">Protocol</label>
                                <select id="scale-protocol-select" style="width: 100%; padding: 0.4rem; background: #1e293b; color: white; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.8rem;">
                                    <option value="auto">Auto-Detect</option>
                                    <option value="cas">CAS (PD-II / SW)</option>
                                    <option value="toledo">Toledo / NCI</option>
                                    <option value="generic">Generic ASCII</option>
                                </select>
                            </div>
                        </div>
                        <div style="display: flex; gap: 0.5rem;">
                            <button onclick="saveScaleSettings()" style="flex: 1; padding: 0.4rem; border-radius: 4px; background: #22c55e; color: white; border: none; font-weight: 600; cursor: pointer; font-size: 0.8rem;">Save Scale Config</button>
                            <button onclick="simulateScaleTest()" style="padding: 0.4rem 0.8rem; border-radius: 4px; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid var(--border-color); cursor: pointer; font-size: 0.8rem;">Simulate 1.250kg</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="margin: 0; font-size: 1.25rem; font-weight: 600;">Recent Jobs</h2>
            </div>

            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Job ID & Time</th>
                            <th>Target Printer</th>
                            <th>Status</th>
                            <th>Retries</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="jobs-table-body">
                        <!-- Jobs injected via JS -->
                        <tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Loading jobs...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        async function fetchPrinters() {
            try {
                const res = await fetch("{{ url_for('api_printers_status') }}");
                const data = await res.json();
                
                const container = document.getElementById('printers-container');
                container.innerHTML = '';
                
                for (const [name, info] of Object.entries(data)) {
                    const card = document.createElement('div');
                    card.className = 'glass-panel printer-card';
                    card.innerHTML = `
                        <div class="printer-header">
                            <span class="printer-name">${name}</span>
                            <span class="badge badge-type">${info.type}</span>
                        </div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">
                            ${info.kitchen ? 'Kitchen Printer' : 'Standard Printer'}
                        </div>
                        <div class="printer-stats">
                            <div>
                                <div style="margin-bottom: 0.25rem;">Queue</div>
                                <div class="queue-count">${info.queue_length}</div>
                            </div>
                            <div style="display: flex; align-items: flex-end;">
                                <button onclick="testPrint('${name}')">Test Print</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                console.error("Failed to fetch printers:", error);
            }
        }

        async function fetchJobs() {
            try {
                const res = await fetch("{{ url_for('api_get_jobs') }}");
                const jobs = await res.json();
                
                const tbody = document.getElementById('jobs-table-body');
                tbody.innerHTML = '';
                
                if (jobs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No recent print jobs.</td></tr>';
                    return;
                }

                jobs.forEach(job => {
                    const tr = document.createElement('tr');
                    
                    // Format timestamp safely
                    let timeStr = job.timestamp;
                    try {
                        const d = new Date(job.timestamp + "Z"); // SQLite usually UTC
                        if (!isNaN(d)) timeStr = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                    } catch(e){}

                    let statusCapitalized = job.status.charAt(0).toUpperCase() + job.status.slice(1);
                    
                    let actionHtml = '';
                    if (job.status === 'failed') {
                        actionHtml = `<button onclick="retryJob('${job.id}')" style="background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-color: transparent;">Retry</button>`;
                    }
                    if (job.status === 'pending' || job.status === 'failed') {
                        actionHtml += `<button onclick="cancelJob('${job.id}')" style="background: rgba(239, 68, 68, 0.1); color: #f87171; border-color: transparent;">Cancel</button>`;
                    }

                    tr.innerHTML = `
                        <td>
                            <div>${timeStr}</div>
                            <div class="job-id">${job.id.split('_').slice(1,3).join('_')}</div>
                        </td>
                        <td><strong>${job.printer_name}</strong></td>
                        <td class="status-${job.status}">
                            <div style="display: flex; align-items: center;">
                                <span class="status-dot"></span>
                                ${statusCapitalized}
                            </div>
                            ${job.error_message ? `<div class="error-msg" title="${job.error_message}">${job.error_message}</div>` : ''}
                        </td>
                        <td>${job.retries > 0 ? job.retries : '-'}</td>
                        <td class="action-btns">${actionHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Failed to fetch jobs:", error);
                document.getElementById('connection-status').innerHTML = `<div class="status-dot" style="background: var(--status-failed); box-shadow: 0 0 8px var(--status-failed);"></div> Disconnected`;
                document.getElementById('connection-status').style.color = 'var(--status-failed)';
            }
        }

        async function testPrint(name) {
            try {
                const res = await fetch("{{ url_for('test_print', printer='') }}" + name, {method: 'POST'});
                const data = await res.json();
                if(!data.success) alert(data.message);
                fetchPrinters();
                fetchJobs();
            } catch(e) {
                alert("Error sending test print.");
            }
        }

        async function retryJob(jobId) {
            try {
                await fetch("{{ url_for('api_retry_job', job_id='') }}" + jobId, {method: 'POST'});
                fetchJobs();
                fetchPrinters();
            } catch(e) {
                alert("Error retrying job.");
            }
        }

        async function cancelJob(jobId) {
            try {
                if(confirm("Are you sure you want to cancel this job?")) {
                    await fetch("{{ url_for('api_cancel_job', job_id='') }}" + jobId, {method: 'POST'});
                    fetchJobs();
                    fetchPrinters();
                }
            } catch(e) {
                alert("Error cancelling job.");
            }
        }

        // --- Scale Polling & Management ---
        let scalePortsLoaded = false;

        async function pollScale() {
            try {
                const res = await fetch("/scale/status");
                const data = await res.json();

                const weightVal = document.getElementById('scale-weight-val');
                const grossVal = document.getElementById('scale-gross-val');
                const tareVal = document.getElementById('scale-tare-val');
                const statusBadge = document.getElementById('scale-status-badge');
                const motionBadge = document.getElementById('scale-motion-badge');
                const portDesc = document.getElementById('scale-port-desc');

                if (!weightVal) return;

                // Weight display
                const w = Number(data.weight || 0).toFixed(3);
                weightVal.innerHTML = `${w} <span style="font-size: 1.5rem; color: #94a3b8;">${data.unit || 'kg'}</span>`;
                grossVal.textContent = `${Number(data.gross_weight || 0).toFixed(3)} ${data.unit || 'kg'}`;
                tareVal.textContent = `${Number(data.tare || 0).toFixed(3)} ${data.unit || 'kg'}`;

                // Status Badge
                if (data.connected) {
                    statusBadge.textContent = "CONNECTED";
                    statusBadge.style.background = "rgba(34, 197, 94, 0.2)";
                    statusBadge.style.color = "#4ade80";
                    portDesc.textContent = `Connected on ${data.port} (${data.config?.baudrate || 9600} baud, ${data.config?.protocol || 'auto'})`;
                } else {
                    statusBadge.textContent = "DISCONNECTED";
                    statusBadge.style.background = "rgba(239, 68, 68, 0.2)";
                    statusBadge.style.color = "#f87171";
                    portDesc.textContent = data.error || (data.config?.port ? `Looking for scale on ${data.config.port}...` : "No scale detected");
                }

                // Motion Badge
                if (data.is_over_capacity) {
                    motionBadge.textContent = "OVERLOAD";
                    motionBadge.style.background = "rgba(239, 68, 68, 0.3)";
                    motionBadge.style.color = "#ef4444";
                } else if (data.is_stable) {
                    motionBadge.textContent = "STABLE";
                    motionBadge.style.background = "rgba(34, 197, 94, 0.2)";
                    motionBadge.style.color = "#4ade80";
                } else {
                    motionBadge.textContent = "MOTION";
                    motionBadge.style.background = "rgba(234, 179, 8, 0.2)";
                    motionBadge.style.color = "#facc15";
                }

                // Populate ports dropdown once
                if (!scalePortsLoaded && data.available_ports) {
                    const select = document.getElementById('scale-port-select');
                    select.innerHTML = '<option value="AUTO">Auto-Detect</option>';
                    for (const p of data.available_ports) {
                        const opt = document.createElement('option');
                        opt.value = p.device;
                        opt.textContent = `${p.device} - ${p.description}`;
                        if (data.config?.port === p.device) opt.selected = true;
                        select.appendChild(opt);
                    }
                    if (data.config?.baudrate) {
                        document.getElementById('scale-baud-select').value = String(data.config.baudrate);
                    }
                    if (data.config?.protocol) {
                        document.getElementById('scale-protocol-select').value = data.config.protocol;
                    }
                    scalePortsLoaded = true;
                }
            } catch (err) {
                console.error("Scale polling error:", err);
            }
        }

        async function triggerScaleTare() {
            try {
                await fetch("/scale/tare", { method: "POST" });
                pollScale();
            } catch(e) {
                alert("Tare error: " + e);
            }
        }

        async function triggerScaleZero() {
            try {
                await fetch("/scale/zero", { method: "POST" });
                pollScale();
            } catch(e) {
                alert("Zero error: " + e);
            }
        }

        function toggleScaleSettings() {
            const p = document.getElementById('scale-config-panel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        async function saveScaleSettings() {
            const port = document.getElementById('scale-port-select').value;
            const baud = parseInt(document.getElementById('scale-baud-select').value, 10);
            const proto = document.getElementById('scale-protocol-select').value;
            try {
                const res = await fetch("/scale/config", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ port: port, baudrate: baud, protocol: proto, enabled: true })
                });
                alert("Scale settings saved!");
                toggleScaleSettings();
                scalePortsLoaded = false;
                pollScale();
            } catch(e) {
                alert("Error saving scale settings: " + e);
            }
        }

        async function simulateScaleTest() {
            try {
                await fetch("/scale/simulate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ weight: 1.250, is_stable: true, unit: "kg" })
                });
                pollScale();
            } catch(e) {
                alert("Simulation error: " + e);
            }
        }

        // Initial fetch and set interval for polling
        fetchPrinters();
        fetchJobs();
        pollScale();
        
        setInterval(() => {
            fetchPrinters();
            fetchJobs();
            // Reset connection status if it was disconnected
            document.getElementById('connection-status').innerHTML = `<div class="status-dot" style="background: var(--status-completed); box-shadow: 0 0 8px var(--status-completed);"></div> Live Updates`;
            document.getElementById('connection-status').style.color = 'var(--status-completed)';
        }, 2500);

        // High frequency scale polling (600ms) for responsive LCD
        setInterval(pollScale, 600);
    </script>

</body>
</html>
